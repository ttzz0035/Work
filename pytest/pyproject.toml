[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-auto-test-framework"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "pytest-html",
    "coverage",
    "hypothesis",
    "ruff",
    "pdoc",
    "pyflowchart",
    "pyvis",
]

[tool.setuptools]
py-modules = ["framework"]
packages = ["tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"target/**/*.py" = ["F821"]